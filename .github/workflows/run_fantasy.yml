name: Yahoo Fantasy Cloud Update

on:
  schedule:
    # 台灣/香港時間每週一下午 5 點 (對應 UTC 時間週一 09:00)
    - cron: '0 9 * * 1'
  workflow_dispatch: # 允許您隨時在 GitHub 網頁手動點擊按鈕執行測試

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝 Chrome 與必要套件
        run: |
          sudo apt-get update
          pip install --upgrade pip
          pip install beautifulsoup4 selenium webdriver-manager requests openpyxl

      - name: 4. 執行雲端爬蟲與網頁生成
        run: |
          python run_fantasy_cloud.py

      - name: 5. 自動提交並推送到 GitHub (觸發 Vercel 部署)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add index.html
          git commit -m "Auto-update: GitHub Actions 雲端自動更新戰況" || echo "No changes to commit"
          git push origin main